name: Publish printable CV PDFs
on:
  push:
    paths:
      - cv.html
      - cv/**
      - assets/css/site.css
      - tools/render_cvs.py
      - assets/cv/manifest.json
      - .github/workflows/build-cv.yml
  workflow_dispatch:
concurrency:
  group: cv-pdfs-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render CV catalogue
        run: python3 tools/render_cvs.py
      - name: Enforce focused CV page limits
        run: python3 tools/render_cvs.py --check
      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/Jay_Antonio_Oliver_CV.pdf assets/cv/*.pdf assets/cv/render-state.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish bilingual CV PDFs"
            git push
          fi
