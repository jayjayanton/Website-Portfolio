<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">Texas RRC wellbore integration workflow</title><desc id="d">Three stages: Python extraction from DBF900 and RK02 completion identifiers; enrichment of updated Well Header data; SQL join with production data using district, well and lease identifiers. Quarterly refreshes were intended.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102c48"/><stop offset="1" stop-color="#214b67"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f2f8"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><path d="M0 535 Q180 485 360 536 T720 528 T1200 536 V675 H0Z" fill="#173951" opacity=".65"/><g fill="#86b7cb" opacity=".12"><path d="M55 500V170h18v330zm-32-280h82v12H23zM30 220l34-95 34 95-10 4-24-66-24 66z"/><circle cx="64" cy="126" r="10"/></g><text x="65" y="83" font-family="Arial,sans-serif" font-size="39" font-weight="700" fill="#fff">Texas RRC Wellbore Integration</text><text x="65" y="124" font-family="Arial,sans-serif" font-size="20" fill="#c2ddeb">Legacy fixed-width data to production-linked well records</text><g font-family="Arial,sans-serif"><rect x="54" y="183" width="338" height="330" rx="20" fill="url(#card)"/><rect x="431" y="183" width="338" height="330" rx="20" fill="url(#card)"/><rect x="808" y="183" width="338" height="330" rx="20" fill="url(#card)"/><g fill="#2a6896"><rect x="78" y="209" width="46" height="46" rx="11"/><rect x="455" y="209" width="46" height="46" rx="11"/><rect x="832" y="209" width="46" height="46" rx="11"/></g><g fill="#fff" font-size="22" font-weight="700" text-anchor="middle"><text x="101" y="239">1</text><text x="478" y="239">2</text><text x="855" y="239">3</text></g><g fill="#173c5d" font-weight="700" font-size="23"><text x="78" y="297">Extract &amp; identify</text><text x="455" y="297">Enrich Well Header</text><text x="832" y="297">Join production</text></g><g fill="#39566d" font-size="19"><text x="78" y="341">DBF900 fixed-width ASCII</text><text x="78" y="374">COBOL copybook parsing</text><text x="78" y="407">RK02 identifier propagation</text><text x="78" y="440">Python · binary search</text><text x="455" y="341">Updated Well Header data</text><text x="455" y="374">+ extracted root-key fields</text><text x="455" y="407">= enriched well records</text><text x="455" y="440">Merge script unavailable</text><text x="832" y="341">SQL composite join key:</text><text x="832" y="382" font-weight="700">DISTRICT_NO</text><text x="832" y="412" font-weight="700">WELL_NO</text><text x="832" y="442" font-weight="700">LEASE_NO</text></g><g stroke="#8dd6f0" stroke-width="5" fill="none" stroke-linecap="round"><path d="M397 350h28m-10-10 10 10-10 10"/><path d="M774 350h28m-10-10 10 10-10 10"/></g><rect x="54" y="552" width="1092" height="75" rx="15" fill="#e1edf4" opacity=".98"/><text x="83" y="583" fill="#174564" font-size="20" font-weight="700">Outcome: Wellbore + enriched header + production integration</text><text x="83" y="611" fill="#42647a" font-size="17">Designed for quarterly updates · conceptual illustration of historical workflow</text></g></svg>