<!doctype html>
<html lang="$language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <meta name="theme-color" content="#24232b">
  <title>$title</title>
  <link rel="canonical" href="$canonical">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$og_image">
  <link rel="icon" href="${prefix}assets/favicon.svg?v=$css_version" type="image/svg+xml">
  <link rel="stylesheet" href="${prefix}assets/css/site.css?v=$css_version">
  <script src="${prefix}assets/js/site.js?v=$js_version" defer></script>
$extra_head
</head>
<body class="$body_class">
  <a class="skip-link" href="#main">$ui_skip</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="$home_href" aria-label="$ui_home"><span class="brand-mark" aria-hidden="true">JO</span><span>Jay Oliver<small>$ui_brand</small></span></a>
      <nav class="site-nav" id="site-nav" aria-label="$ui_nav">$navigation<a class="nav-cv" href="$cv_href"$cv_current>$ui_cv</a></nav>
      <div class="header-controls"><nav class="site-language-picker" aria-label="$language_label">$language_links</nav><button class="nav-toggle" type="button" aria-controls="site-nav" aria-expanded="false" data-label-open="$ui_menu" data-label-close="$ui_close" hidden>$ui_menu</button></div>
    </div>
  </header>
  <main id="main">$body</main>
  <footer class="site-footer">
    <div class="container footer-inner"><div><a class="footer-name" href="$home_href">Jay Oliver</a><p>$ui_footer</p></div><div class="footer-links"><a href="mailto:jayjayoliver@hotmail.com">$ui_email</a><a href="https://www.linkedin.com/in/jay-oliver-b22552b4" target="_blank" rel="noopener noreferrer">LinkedIn</a><a href="https://github.com/jayjayanton" target="_blank" rel="noopener noreferrer">$ui_code</a><a href="$contact_href">$ui_contact</a></div><p class="copyright">© 2026 Jay Oliver</p></div>
  </footer>
</body>
</html>
